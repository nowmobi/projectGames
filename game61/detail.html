<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Detail</title>
    <link rel="stylesheet" href="public/style/inpublic.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  </head>

  
  <body class="has-back-button page-detail">
    <header class="header fixed">
      <div class="header-content">
        <div class="back-button" id="backButton">
          <i class="fas fa-arrow-left"></i>
        </div>
        <div class="logo">
          <p>nythera.fun</p>
        </div>
        <div class="header-actions">
          <div class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
          </div>
        </div>
      </div>
    </header>

    <div class="category-menu" id="categoryMenu">
      <div class="category-header">
        <span>Categories</span>
        <div class="close-menu" id="closeMenu">
          <i class="fas fa-times"></i>
        </div>
      </div>
      <div class="category-list">
        <!-- Categories will be dynamically generated by JavaScript -->
      </div>
    </div>

   


   
<main class="main-content">
 
  <div class="ads">
    <div id="div-gpt-ad-detail1"></div>
  </div>
  
      <div class="game-top-section">
        <div class="game-image-section">
          <img src="" alt="" id="gameImage" />
        </div>
        <a href="#" class="play-now-btn" id="playNowBtn">
          <i class="fas fa-play"></i>
          <span>Play Now</span>
        </a>
      </div>

      <div class="game-rating">
        <div class="stars" id="gameStars"></div>
        <span class="rating-text" id="ratingText">4/5</span>
      </div>

      <div class="game-info">
        <h1 class="game-title" id="gameTitle">Game Title</h1>

        <div class="category-badge" id="categoryBadge">ACTION</div>

        <div class="game-description">
          <p id="gameDescription">Game description will be loaded here...</p>
        </div>

        <div class="recommendations-section">
          <h3 class="recommendations-title">
            <i class="fas fa-thumbs-up"></i>
            Recommended Games
          </h3>
          <div class="recommendations-grid" id="recommendationsGrid">
            
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-upper">
        <a href="pages/privacy.html">Privacy Policy</a>
        <a href="pages/terms.html">Terms of Use</a>
      </div>
      <div class="footer-lower">
        <div class="footer-brand">nythera.fun</div>
        <div class="footer-copyright">
          ©2026 nythera.fun All Rights Reserved.
        </div>
      </div>
    </footer>

       <script type="module" src="public/js/detail.js"></script>
    <script type="module" src="public/js/inpublic.js"></script>
<script type="module">
        import { loadAdsScript } from "./public/js/ad_loader_logic.js";
      loadAdsScript("detail");
</script>
  </body>
</html>
