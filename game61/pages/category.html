<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Categories</title>
    <link rel="stylesheet" href="../public/style/inpublic.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>

  <body class="has-back-button page-category">
    <header class="header fixed">
      <div class="header-content">
        <div class="back-button" id="backButton">
          <i class="fas fa-arrow-left"></i>
        </div>
        <div class="logo">
          <p>nythera.fun</p>
        </div>
        <div class="header-actions">
          <div class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
          </div>
        </div>
      </div>
    </header>

    <div class="category-menu" id="categoryMenu">
      <div class="category-header">
        <span>Categories</span>
        <div class="close-menu" id="closeMenu">
          <i class="fas fa-times"></i>
        </div>
      </div>
      <div class="category-list"></div>
    </div>

    <main class="main-content">
      <div class="ads">
        <div id="div-gpt-ad-category1"></div>
      </div>
      <div class="game-list">
        <div class="list-header">
          <h2 id="categoryTitle">All Games</h2>
        </div>
        <div class="game-grid" id="gameGrid"></div>
        <div class="load-more-section">
          <button class="load-more-btn" id="loadMoreBtn">Load More</button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-upper">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
      </div>
      <div class="footer-lower">
        <div class="footer-brand">nythera.fun</div>
        <div class="footer-copyright">
          ©2025 nythera.fun All Rights Reserved.
        </div>
      </div>
    </footer>

    <script type="module" src="../public/js/inpublic.js"></script>

    <script type="module">
      import { loadAdsScript } from "../public/js/ad_loader_logic.js";
      loadAdsScript("category");
    </script>
  </body>
</html>
